openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Scholix tutoring platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User operations
  - name: tutors
    description: Tutor operations
  - name: students
    description: Student operations
  - name: sessions
    description: Session operations
  - name: payments
    description: Payment operations
  - name: admin
    description: Admin operations

paths:
  /tutors/me/education:
    get:
      operationId: getMyEducation
      security: [{ bearerAuth: [] }]
      tags: [tutors]
      summary: Read own approved and proposed qualifications
      responses:
        "200":
          description: Own qualifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TutorEducation" }
        "403": { description: Tutor account required }
    put:
      operationId: submitEducation
      security: [{ bearerAuth: [] }]
      tags: [tutors]
      summary: Submit qualifications for admin approval without changing published details
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EducationProposal" }
      responses:
        "200":
          description: Pending qualification update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TutorEducation" }
        "400": { description: Invalid qualifications }
        "403": { description: Tutor account required }
  /admin/tutors/{tutorId}/education:
    post:
      operationId: decideEducation
      security: [{ bearerAuth: [] }]
      tags: [admin]
      summary: Approve or reject the exact pending qualification proposal
      parameters:
        - { name: tutorId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EducationDecision" }
      responses:
        "200":
          description: Qualification decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TutorEducation" }
        "403": { description: Admin required }
        "409": { description: Proposal changed or is no longer pending }
  /admin/users/{userId}/approve-parent:
    post:
      operationId: approveParent
      security: [{ bearerAuth: [] }]
      tags: [admin]
      summary: Approve a pending active parent account
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Approved parent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "403": { description: Admin required }
        "409": { description: Not an active pending parent }
  /tutors/me/promotion:
    get:
      operationId: getMyPromotion
      security: [{ bearerAuth: [] }]
      tags: [tutors]
      summary: Read own promotion checklist
      responses:
        "200":
          description: Promotion checklist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TutorPromotion" }
    put:
      operationId: updateMyPromotion
      security: [{ bearerAuth: [] }]
      tags: [tutors]
      summary: Persist a self-reported promotion action
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionActionUpdate" }
      responses:
        "200":
          description: Updated checklist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TutorPromotion" }
        "400": { description: Invalid action }
        "403": { description: Tutor required }
  /tutors/{tutorId}/reviews:
    get:
      operationId: listTutorReviews
      tags: [tutors]
      summary: List public reviews for a tutor
      parameters:
        - { name: tutorId, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 2147483647 } }
      responses:
        "200":
          description: Tutor reviews
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionReview" }
  /sessions/{sessionId}/reviews:
    get:
      operationId: getSessionReview
      security: [{ bearerAuth: [] }]
      tags: [sessions]
      summary: Get review eligibility and an existing review for the authenticated parent
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 2147483647 } }
      responses:
        "200":
          description: Review state for an owned session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionReviewState"
        "401": { description: Authentication required }
        "403": { description: Parent account required }
        "404": { description: Session unavailable to this parent }
    post:
      operationId: createSessionReview
      security: [{ bearerAuth: [] }]
      tags: [sessions]
      summary: Submit one review per parent and tutor after a completed owned session
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 2147483647 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionReviewBody" }
      responses:
        "201":
          description: Review submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionReview" }
        "400": { description: "Invalid rating, comment or session ID" }
        "401": { description: Authentication required }
        "403": { description: Parent account required }
        "404": { description: Session unavailable to this parent }
        "409": { description: Session incomplete or already reviewed }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Credentials accepted; OTP verification is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallengeResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Register a new user or request approval to reactivate an inactive account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupBody"
      responses:
        "201":
          description: New account or existing-account reapplication; email OTP verification is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallengeResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reapply/verify:
    post:
      operationId: verifyReapplication
      tags: [auth]
      summary: Verify email for an inactive account reapplication without issuing a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpBody"
      responses:
        "200":
          description: Reapplication submitted for admin approval; account remains inactive
          content:
            application/json:
              schema:
                type: object
                required: [pendingApproval, message]
                properties:
                  pendingApproval:
                    type: boolean
                  message:
                    type: string
        "400":
          description: Invalid user ID or code format
        "401":
          description: Invalid or expired code
        "409":
          description: Account is active or request was already submitted
        "429":
          description: Too many verification attempts

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify a one-time code and create an authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpBody"
      responses:
        "200":
          description: OTP verified and access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: OTP is invalid, expired, or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/resend-otp:
    post:
      operationId: resendOtp
      tags: [auth]
      summary: Send a replacement one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendOtpBody"
      responses:
        "200":
          description: Replacement code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpResendResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /tutors:
    get:
      operationId: listTutors
      tags: [tutors]
      summary: List all approved tutors
      responses:
        "200":
          description: List of tutors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TutorProfile"

  /tutors/{tutorId}:
    get:
      operationId: getTutor
      tags: [tutors]
      summary: Get a tutor by ID
      parameters:
        - name: tutorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tutor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tutors/{tutorId}/profile:
    put:
      operationId: updateTutorProfile
      tags: [tutors]
      summary: Update tutor profile
      parameters:
        - name: tutorId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTutorProfileBody"
      responses:
        "200":
          description: Updated tutor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorProfile"

  /tutors/{tutorId}/availability:
    get:
      operationId: getTutorAvailability
      tags: [tutors]
      summary: Get tutor availability slots
      parameters:
        - name: tutorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of availability slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilitySlot"
    put:
      operationId: setTutorAvailability
      tags: [tutors]
      summary: Set tutor availability slots
      parameters:
        - name: tutorId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAvailabilityBody"
      responses:
        "200":
          description: Updated availability slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilitySlot"

  /tutors/{tutorId}/unavailable-periods:
    get:
      operationId: getTutorUnavailablePeriods
      security: [{ bearerAuth: [] }]
      tags: [tutors]
      summary: List a tutor's blocked date ranges
      parameters:
        - name: tutorId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Blocked date ranges
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TutorUnavailablePeriod" }
        "401": { description: Authentication required }
        "403": { description: Tutor owner or admin required }
    post:
      operationId: createTutorUnavailablePeriod
      security: [{ bearerAuth: [] }]
      tags: [tutors]
      summary: Block a tutor date range
      parameters:
        - name: tutorId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TutorUnavailablePeriodInput" }
      responses:
        "201":
          description: Date range blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TutorUnavailablePeriod" }
        "400": { description: Invalid date range }
        "401": { description: Authentication required }
        "403": { description: Tutor owner or admin required }
        "409": { description: The range overlaps an existing booking or blocked period }

  /tutors/{tutorId}/unavailable-periods/{periodId}:
    delete:
      operationId: deleteTutorUnavailablePeriod
      security: [{ bearerAuth: [] }]
      tags: [tutors]
      summary: Remove a tutor's blocked date range
      parameters:
        - name: tutorId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: periodId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Date range removed }
        "401": { description: Authentication required }
        "403": { description: Tutor owner or admin required }
        "404": { description: Date range not found }

  /tutors/{tutorId}/offers:
    post:
      operationId: createTutorLessonOffer
      security: [{ bearerAuth: [] }]
      tags: [tutors]
      summary: Offer an available lesson time to a student's parent
      parameters:
        - name: tutorId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TutorLessonOfferInput" }
      responses:
        "201":
          description: Lesson time offered; parent acceptance is still required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { description: Invalid offer or unavailable time }
        "401": { description: Authentication required }
        "403": { description: Tutor owner or active approved parent required }
        "404": { description: Tutor or student not found }
        "409": { description: Time is already reserved or conflicts with an existing booking }

  /tutors/{tutorId}/available-slots:
    get:
      operationId: getTutorAvailableSlots
      tags: [tutors]
      summary: Get dynamically computed available start times for a tutor on a given date
      parameters:
        - name: lessonMode
          in: query
          schema: { type: string, enum: [online, in_person] }
        - name: tutorId
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
          description: "YYYY-MM-DD"
        - name: duration
          in: query
          required: true
          schema:
            type: integer
          description: "Session duration in minutes"
        - name: studentId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: "Optional student for an authenticated tutor's relationship-specific availability"
      responses:
        "200":
          description: Available start times
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableSlotsResponse"
        "400":
          description: Missing or invalid parameters
        "404":
          description: Tutor not found

  /tutors/{tutorId}/students:
    get:
      operationId: getTutorStudents
      tags: [tutors]
      summary: Get students associated with a tutor
      parameters:
        - name: tutorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TutorStudent"

  /tutors/{tutorId}/relationships:
    get:
      operationId: getTutorRelationships
      tags: [tutors]
      summary: Get all per-parent lesson preferences for a tutor
      parameters:
        - name: tutorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of relationship preference records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TutorRelationship"
        "403":
          description: Forbidden

  /tutors/{tutorId}/relationships/{parentId}:
    get:
      operationId: getTutorRelationshipForParent
      tags: [tutors]
      summary: Get lesson-mode and travel-buffer overrides for a specific parent
      parameters:
        - name: tutorId
          in: path
          required: true
          schema:
            type: integer
        - name: parentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Relationship record (null fields if no override set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorRelationship"
        "403":
          description: Forbidden
        "404":
          description: No relationship record found
    put:
      operationId: upsertTutorRelationship
      tags: [tutors]
      summary: Set lesson-mode and travel-buffer overrides for a specific parent
      parameters:
        - name: tutorId
          in: path
          required: true
          schema:
            type: integer
        - name: parentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertRelationshipBody"
      responses:
        "200":
          description: Updated relationship record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorRelationship"
        "403":
          description: Forbidden

  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List all students
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [students]
      summary: Create a new student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentBody"
      responses:
        "201":
          description: Created student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/{studentId}:
    patch:
      operationId: updateStudent
      summary: Update an owned active student profile
      tags: [students]
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentProfileUpdate" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
        "403": { description: Not the owning parent or an admin }
        "404": { description: Student not found }
    delete:
      operationId: removeStudent
      summary: Remove an owned child, retaining restricted history where necessary
      tags: [students]
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentRemovalConfirmation" }
      responses:
        "200":
          description: Removed or archived profile and revoked linked student access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountRemovalResult" }
        "403": { description: Not the owning parent or an admin }
        "409": { description: Resolve upcoming sessions before removal }
    get:
      operationId: getStudent
      tags: [students]
      summary: Get a student by ID
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /students/{studentId}/invite:
    post:
      operationId: inviteStudent
      tags: [students]
      summary: Invite student to create their own account (future feature)
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteStudentBody"
      responses:
        "501":
          description: Not yet implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List sessions (filtered by role context)
      parameters:
        - name: tutorId
          in: query
          schema:
            type: integer
        - name: studentId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_payment, pending_confirmation, scheduled, completed, cancelled]
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      security: [{ bearerAuth: [] }]
      tags: [sessions]
      summary: Create a new session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{sessionId}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a session by ID
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{sessionId}/complete:
    post:
      operationId: completeSession
      security: [{ bearerAuth: [] }]
      tags: [sessions]
      summary: Mark a session as complete and generate invoice
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Completed session with invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionWithInvoice"

  /sessions/{sessionId}/decision:
    post:
      operationId: decideSessionRequest
      security: [{ bearerAuth: [] }]
      tags: [sessions]
      summary: Owning tutor accepts or declines an authorised booking request
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionDecisionInput" }
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "403": { description: Only the owning tutor may decide }
        "409": { description: Request expired or already decided }

  /sessions/{sessionId}/cancel:
    post:
      operationId: cancelSession
      security: [{ bearerAuth: [] }]
      tags: [sessions]
      summary: Cancel a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List invoices belonging to the authenticated parent or tutor
      description: Parent and tutor IDs are accepted for compatibility but must match the authenticated account. Omitting them returns the current account's invoices.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: parentId
          in: query
          required: false
          schema:
            type: integer
        - name: tutorId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Invoices owned by the authenticated account
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: "#/components/schemas/ParentInvoiceSummary"
                    - $ref: "#/components/schemas/TutorInvoiceSummary"
        "400":
          description: Invalid owner ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The role or requested owner is not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{invoiceId}/pdf:
    get:
      operationId: downloadInvoicePdf
      tags: [invoices]
      summary: Download an invoice PDF owned by the authenticated account
      security: [{ bearerAuth: [] }]
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Invoice PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid invoice ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invoice access is not available for this account role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invoice does not exist or is not owned by the authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/simulate:
    post:
      operationId: simulatePayment
      security: [{ bearerAuth: [] }]
      tags: [payments]
      summary: Authorise a simulated beta hold, without capture, for tutor confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulatePaymentBody"
      responses:
        "200":
          description: Payment simulated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments:
    get:
      operationId: listPayments
      security: [{ bearerAuth: [] }]
      tags: [payments]
      summary: List payments
      parameters:
        - name: sessionId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

  /admin/user-requests:
    get:
      operationId: listAdminUserRequests
      summary: Pending user requests ordered by priority and oldest first
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Removal, verified reapplication and account approval work awaiting admins
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUserRequest" }
        "401": { description: Sign in required }
        "403": { description: Admin required }
  /admin/deletion-requests:
    get:
      operationId: listDeletionRequests
      summary: Admin deletion-request queue, pending first
      tags: [admin]
      responses:
        "200":
          description: Requests with current account identity and review outcome
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountDeletionRequest" }
        "403": { description: Admin required }
  /admin/deletion-requests/{requestId}:
    patch:
      operationId: reviewDeletionRequest
      summary: Approve restricted family archival or reject a deletion request
      tags: [admin]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeletionRequestDecision" }
      responses:
        "200":
          description: Review result, retained records and affected family counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountRemovalResult" }
        "403": { description: Admin required }
        "409": { description: "Already reviewed, self action, or unresolved sessions" }
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: Search users (admin only)
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{userId}:
    get:
      operationId: getAdminUser
      tags: [admin]
      summary: Get user details (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "404":
          description: User not found
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Delete a user without durable business history (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Account deleted
        "400":
          description: Self-deletion is not allowed
        "403":
          description: Admin access required
        "404":
          description: User not found
        "409":
          description: Account has related records that prevent safe deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserManagementError"

  /admin/users/{userId}/status:
    patch:
      operationId: updateAdminUserStatus
      tags: [admin]
      summary: Activate or deactivate a user (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserStatusUpdate"
      responses:
        "200":
          description: Updated user status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid request or self-action
        "403":
          description: Admin access required
        "404":
          description: User not found
        "409":
          description: Cannot deactivate the last active administrator

  /admin/tutors/{tutorId}/approve:
    post:
      operationId: approveTutor
      tags: [admin]
      summary: Approve or unapprove a tutor
      parameters:
        - name: tutorId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveTutorBody"
      responses:
        "200":
          description: Tutor approval updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorProfile"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get platform-wide statistics
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /sessions/summary:
    get:
      operationId: getSessionSummary
      tags: [sessions]
      summary: Get session counts by status for the current user
      parameters:
        - name: tutorId
          in: query
          schema:
            type: integer
        - name: studentId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    SignupBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [tutor, parent, student, admin]
      required: [email, password, firstName, lastName, role]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required: [user, token]

    OtpChallengeResponse:
      type: object
      properties:
        reapplication:
          type: boolean
        requiresOtp:
          type: boolean
          const: true
        pendingUserId:
          type: integer
        email:
          type: string
        devOtp:
          type: string
        emailFailed:
          type: boolean
      required: [requiresOtp, pendingUserId, email]

    VerifyOtpBody:
      type: object
      properties:
        pendingUserId:
          type: integer
        otp:
          type: string
      required: [pendingUserId, otp]

    ResendOtpBody:
      type: object
      properties:
        pendingUserId:
          type: integer
      required: [pendingUserId]

    OtpResendResponse:
      type: object
      properties:
        ok:
          type: boolean
        devOtp:
          type: string
        emailFailed:
          type: boolean
      required: [ok]

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [tutor, parent, student, admin]
        parentApproved:
          type: boolean
        createdAt:
          type: string
      required: [id, email, firstName, lastName, role, createdAt]

    AdminUserRequest:
      type: object
      required: [id, kind, resourceId, userId, email, firstName, lastName, role, requestedAt, priority, reason]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [removal, reapplication, parent_approval, tutor_verification, qualification_update]
        resourceId: { type: integer }
        userId: { type: integer }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        role: { type: string, enum: [parent, tutor, student, admin] }
        requestedAt: { type: string, format: date-time }
        priority: { type: string, enum: [urgent, high, normal] }
        reason: { type: [string, "null"] }
    AdminUser:
      type: object
      properties:
        archivedAt:
          type: [string, "null"]
          format: date-time
        deletionRequestedAt:
          type: [string, "null"]
          format: date-time
        reapplicationRequestedAt:
          type: string
          format: date-time
          nullable: true
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [tutor, parent, student, admin]
        createdAt:
          type: string
          format: date-time
        isActive:
          type: boolean
        parentApproved:
          type: boolean
        verificationStatus:
          type: [string, "null"]
        tutorApproved:
          type: [boolean, "null"]
        studentIdentityVerified:
          type: [boolean, "null"]
      required: [id, email, firstName, lastName, role, createdAt, isActive, verificationStatus, tutorApproved, studentIdentityVerified]

    AdminUserStatusUpdate:
      type: object
      properties:
        isActive:
          type: boolean
      required: [isActive]

    AdminUserManagementError:
      type: object
      properties:
        error:
          type: string
      required: [error]

    TutorProfile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        bio:
          type: string
          nullable: true
        subjects:
          type: array
          items:
            type: string
        hourlyRate:
          type: number
        isApproved:
          type: boolean
        verificationStatus:
          type: string
        educationDetails:
          type: string
          nullable: true
        sessionCount:
          type: integer
        sessionDurations:
          type: array
          nullable: true
          items:
            type: integer
          description: "Allowed session lengths in minutes, e.g. [60, 90]"
        teachingMode:
          type: string
          enum: [online, in_person, both]
          description: "Tutor's default teaching mode"
        travelBufferMinutes:
          type: integer
          description: "Buffer time in minutes the tutor requires between travel sessions"
        createdAt:
          type: string
      required: [id, userId, firstName, lastName, email, subjects, hourlyRate, isApproved, verificationStatus, sessionCount, teachingMode, travelBufferMinutes, createdAt]

    UpdateTutorProfileBody:
      type: object
      properties:
        bio:
          type: string
        subjects:
          type: array
          items:
            type: string
        hourlyRate:
          type: number
        sessionDurations:
          type: array
          nullable: true
          items:
            type: integer
          description: "Allowed session lengths in minutes, e.g. [60, 90]"
        teachingMode:
          type: string
          enum: [online, in_person, both]
          description: "Tutor's default teaching mode"
        travelBufferMinutes:
          type: integer
          description: "Buffer time in minutes the tutor requires between travel sessions"

    TutorUnavailablePeriod:
      type: object
      properties:
        id: { type: integer }
        tutorId: { type: integer }
        startDate: { type: string, description: "YYYY-MM-DD" }
        endDate: { type: string, description: "YYYY-MM-DD" }
        note: { type: ["string", "null"], maxLength: 160 }
        createdAt: { type: string, format: date-time }
      required: [id, tutorId, startDate, endDate, createdAt]

    TutorUnavailablePeriodInput:
      type: object
      additionalProperties: false
      properties:
        startDate: { type: string, description: "YYYY-MM-DD" }
        endDate: { type: string, description: "YYYY-MM-DD" }
        note: { type: string, maxLength: 160 }
      required: [startDate, endDate]

    TutorLessonOfferInput:
      type: object
      additionalProperties: false
      properties:
        studentId: { type: integer, minimum: 1 }
        subject: { type: string, minLength: 1, maxLength: 200 }
        scheduledAt: { type: string, description: "ISO date-time with explicit timezone" }
        durationMinutes: { type: integer, enum: [30, 45, 60, 90] }
        lessonMode: { type: string, enum: [online, in_person] }
      required: [studentId, subject, scheduledAt, durationMinutes, lessonMode]

    AvailabilitySlot:
      type: object
      description: A recurring weekly availability window for a tutor
      properties:
        id:
          type: integer
        tutorId:
          type: integer
        dayOfWeek:
          type: integer
          description: "0=Mon, 1=Tue, 2=Wed, 3=Thu, 4=Fri, 5=Sat, 6=Sun"
        startTime:
          type: string
          description: "HH:MM format (24h)"
        endTime:
          type: string
          description: "HH:MM format (24h)"
        timezone:
          type: string
      required: [id, tutorId, dayOfWeek, startTime, endTime]

    SetAvailabilityBody:
      type: object
      properties:
        windows:
          type: array
          items:
            type: object
            properties:
              dayOfWeek:
                type: integer
                description: "0=Mon … 6=Sun"
              startTime:
                type: string
                description: "HH:MM format"
              endTime:
                type: string
                description: "HH:MM format"
            required: [dayOfWeek, startTime, endTime]
      required: [windows]

    AvailableSlotsResponse:
      type: object
      properties:
        timezone: { type: string }
        lessonMode: { type: string, enum: [online, in_person] }
        preferredSlots:
          type: array
          items: { type: string }
        slotInstants:
          type: object
          additionalProperties: { type: string }
        date:
          type: string
          description: "YYYY-MM-DD"
        duration:
          type: integer
          description: "Session duration in minutes"
        slots:
          type: array
          items:
            type: string
          description: "Available start times in HH:MM (24h) format"
      required: [date, duration, slots, timezone, lessonMode, preferredSlots, slotInstants]

    StudentProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: [string, "null"], maxLength: 100 }
        yearLevel: { type: [string, "null"], maxLength: 30 }
        school: { type: [string, "null"], maxLength: 200 }
        subjects: { type: [string, "null"], maxLength: 1000 }
        goals: { type: [string, "null"], maxLength: 2000 }
        dateOfBirth: { type: [string, "null"], format: date }
    StudentRemovalConfirmation:
      type: object
      additionalProperties: false
      required: [confirmationName]
      properties:
        confirmationName: { type: string, minLength: 1, maxLength: 201 }
    DeletionRequestDecision:
      type: object
      additionalProperties: false
      required: [decision, confirmationEmail]
      properties:
        decision: { type: string, enum: [approve, reject] }
        confirmationEmail: { type: string, format: email }
        notes: { type: string, maxLength: 1000 }
    AccountRemovalResult:
      type: object
      required: [message, archived, affectedStudents, affectedAccounts]
      properties:
        message: { type: string }
        archived: { type: boolean }
        affectedStudents: { type: integer }
        affectedAccounts: { type: integer }
    AccountDeletionRequest:
      type: object
      required: [id, userId, email, role, firstName, lastName, status, requestedAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        email: { type: string }
        role: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        reason: { type: [string, "null"] }
        status: { type: string, enum: [pending, approved, rejected] }
        requestedAt: { type: string, format: date-time }
        reviewedAt: { type: [string, "null"], format: date-time }
        reviewNotes: { type: [string, "null"] }
    TutorStudent:
      type: object
      description: Student profile fields available only to the assigned tutor or an admin.
      properties:
        id: { type: integer }
        userId: { type: ["integer", "null"] }
        firstName: { type: string }
        lastName: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        yearLevel: { type: ["string", "null"] }
        school: { type: ["string", "null"] }
        subjects: { type: ["string", "null"] }
        goals: { type: ["string", "null"] }
        parentId: { type: ["integer", "null"] }
        createdAt: { type: string }
      required: [id, firstName, createdAt]

    Student:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
          nullable: true
        firstName:
          type: string
        lastName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        yearLevel:
          type: string
          nullable: true
        school:
          type: string
          nullable: true
        subjects:
          type: string
          nullable: true
        goals:
          type: string
          nullable: true
        parentId:
          type: integer
          nullable: true
        dateOfBirth:
          type: string
          nullable: true
        isIdentityVerified:
          type: boolean
        createdAt:
          type: string
      required: [id, firstName, isIdentityVerified, createdAt]

    CreateStudentBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        yearLevel:
          type: string
        school:
          type: string
        subjects:
          type: string
        goals:
          type: string
        dateOfBirth:
          type: string
        parentId:
          type: integer
      required: [firstName]

    InviteStudentBody:
      type: object
      properties:
        email:
          type: string
      required: [email]

    Session:
      type: object
      properties:
        lessonMode: { type: [string, "null"], enum: [online, in_person, null] }
        locationAddress: { type: [string, "null"], description: "Only returned to the assigned tutor for a scheduled or completed in-person lesson." }
        tutorConfirmedAt: { type: ["string", "null"] }
        requestExpiresAt: { type: [string, "null"] }
        cancellationReason: { type: [string, "null"] }
        paymentStatus: { type: [string, "null"] }
        id:
          type: integer
        tutorId:
          type: integer
        studentId:
          type: integer
        subject:
          type: string
        scheduledAt:
          type: string
        durationMinutes:
          type: integer
        status:
          type: string
          enum: [pending_payment, pending_confirmation, scheduled, completed, cancelled]
        isPaid:
          type: boolean
        totalAmount:
          type: number
        tutorName:
          type: string
          nullable: true
        studentName:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, tutorId, studentId, subject, scheduledAt, durationMinutes, status, isPaid, totalAmount, createdAt]

    CreateSessionBody:
      type: object
      properties:
        lessonMode: { type: string, enum: [online, in_person] }
        tutorId:
          type: integer
        studentId:
          type: integer
        subject:
          type: string
        scheduledAt:
          type: string
        durationMinutes:
          type: integer
        availabilitySlotId:
          type: integer
          nullable: true
      required: [tutorId, studentId, subject, scheduledAt, durationMinutes, lessonMode]

    SessionDecisionInput:
      type: object
      additionalProperties: false
      properties:
        decision: { type: string, enum: [accept, decline] }
      required: [decision]

    SessionWithInvoice:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/Session"
        invoice:
          $ref: "#/components/schemas/Invoice"
      required: [session, invoice]

    Invoice:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        totalAmount:
          type: number
        platformCommission:
          type: number
        tutorEarnings:
          type: number
        commissionRate:
          type: number
        generatedAt:
          type: string
        tutorName:
          type: string
        studentName:
          type: string
        subject:
          type: string
        durationMinutes:
          type: integer
      required: [id, sessionId, totalAmount, platformCommission, tutorEarnings, commissionRate, generatedAt, tutorName, studentName, subject, durationMinutes]

    ParentInvoiceSummary:
      type: object
      properties:
        id:
          type: integer
        invoiceNumber:
          type: string
        sessionId:
          type: integer
        totalAmount:
          type: number
        generatedAt:
          type: string
        tutorName:
          type: string
        studentName:
          type: string
        subject:
          type: string
        scheduledAt:
          type: string
        durationMinutes:
          type: integer
      required: [id, invoiceNumber, sessionId, totalAmount, generatedAt, tutorName, studentName, subject, scheduledAt, durationMinutes]

    TutorInvoiceSummary:
      type: object
      properties:
        id:
          type: integer
        invoiceNumber:
          type: string
        sessionId:
          type: integer
        totalAmount:
          type: number
        platformCommission:
          type: number
        tutorEarnings:
          type: number
        commissionRate:
          type: number
        commissionTier:
          type: string
        generatedAt:
          type: string
        studentName:
          type: string
        subject:
          type: string
        scheduledAt:
          type: string
        durationMinutes:
          type: integer
      required: [id, invoiceNumber, sessionId, totalAmount, platformCommission, tutorEarnings, commissionRate, commissionTier, generatedAt, studentName, subject, scheduledAt, durationMinutes]

    Payment:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        amount:
          type: number
        status:
          type: string
          enum: [pending, authorized, released, paid, refunded]
        simulatedAt:
          type: string
      required: [id, sessionId, amount, status, simulatedAt]

    SimulatePaymentBody:
      type: object
      properties:
        sessionId:
          type: integer
      required: [sessionId]

    ApproveTutorBody:
      type: object
      properties:
        approved:
          type: boolean
      required: [approved]

    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalTutors:
          type: integer
        approvedTutors:
          type: integer
        totalStudents:
          type: integer
        totalSessions:
          type: integer
        completedSessions:
          type: integer
        scheduledSessions:
          type: integer
        totalRevenue:
          type: number
        platformCommission:
          type: number
      required: [totalUsers, totalTutors, approvedTutors, totalStudents, totalSessions, completedSessions, scheduledSessions, totalRevenue, platformCommission]

    TutorRelationship:
      type: object
      description: Per-parent lesson-mode and travel-buffer override for a tutor
      properties:
        id:
          type: integer
        tutorId:
          type: integer
        parentId:
          type: integer
        lessonMode:
          type: string
          nullable: true
          description: "Override the tutor's default teaching mode for this family"
        travelBufferMinutes:
          type: integer
          nullable: true
          description: "Override travel buffer in minutes (null = use tutor default)"
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, tutorId, parentId, createdAt, updatedAt]

    UpsertRelationshipBody:
      type: object
      description: Fields to set on a tutor-parent relationship record
      properties:
        lessonMode:
          type: string
          nullable: true
        travelBufferMinutes:
          type: integer
          nullable: true

    SessionSummary:
      type: object
      properties:
        scheduled:
          type: integer
        completed:
          type: integer
        cancelled:
          type: integer
        total:
          type: integer
      required: [scheduled, completed, cancelled, total]

    SessionReview:
      type: object
      required: [id, sessionId, authorId, tutorId, rating, comment, createdAt]
      properties:
        id: { type: integer }
        sessionId: { type: integer }
        authorId: { type: integer }
        tutorId: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    TutorEducation:
      type: object
      required: [tutorId, educationDetails, pendingEducationDetails, educationReviewStatus, educationReviewNotes, educationSubmittedAt]
      properties:
        tutorId: { type: integer }
        educationDetails: { type: [string, "null"] }
        pendingEducationDetails: { type: [string, "null"] }
        educationReviewStatus: { type: string, enum: [none, pending, approved, rejected] }
        educationReviewNotes: { type: [string, "null"] }
        educationSubmittedAt: { type: [string, "null"], format: date-time }
    EducationProposal:
      type: object
      additionalProperties: false
      required: [educationDetails]
      properties:
        educationDetails: { type: string, minLength: 1, maxLength: 5000 }
    EducationDecision:
      type: object
      additionalProperties: false
      required: [action, expectedSubmittedAt]
      properties:
        action: { type: string, enum: [approve, reject] }
        expectedSubmittedAt: { type: string, format: date-time }
        notes: { type: string, maxLength: 2000 }
    TutorPromotion:
      type: object
      required: [tutorId, completedActions]
      properties:
        tutorId: { type: integer }
        completedActions:
          type: array
          items: { type: string, enum: [share_profile, invite_family, social_intro] }
    PromotionActionUpdate:
      type: object
      additionalProperties: false
      required: [action, completed]
      properties:
        action: { type: string, enum: [share_profile, invite_family, social_intro] }
        completed: { type: boolean }
    SessionReviewState:
      type: object
      required: [eligible, review]
      properties:
        eligible: { type: boolean }
        review:
          allOf: [{ $ref: "#/components/schemas/SessionReview" }]
          nullable: true

    CreateSessionReviewBody:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 2000 }
